name: Sol v1.5.4 candidate validation

on:
  push:
    branches:
      - cabinet/sol-v1.5.4-quality-parallelism
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-diagnostics:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      TMPDIR: /Users/macbook/ChatGPT/.scratch
      CODEX_HOME: /Users/macbook/.codex
      PYTHONPATH: /Users/macbook/ChatGPT/skills/sol-cabinet/tests:/Users/macbook/ChatGPT/skills/sol-cabinet/scripts
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Build canonical-path validation environment
        run: |
          sudo mkdir -p /Users/macbook/ChatGPT /Users/macbook/.codex /Users/macbook/.agents
          sudo chown -R "$(id -un)":staff /Users/macbook
          rsync -a --exclude '.git' ./ /Users/macbook/ChatGPT/
          mkdir -p /Users/macbook/ChatGPT/.scratch /Users/macbook/ChatGPT/workspace
          chmod 700 /Users/macbook/.codex
      - name: Keep validation version frozen
        working-directory: /Users/macbook/ChatGPT
        run: test "$(cat skills/sol-cabinet/VERSION)" = "1.5.3"
      - name: Parallel planning regression
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest discover -s tests -p 'test_parallel_planning.py' -v
      - name: Parallel Office batch regression
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest discover -s tests -p 'test_office_batch_inspection.py' -v
      - name: Frozen quality validation regression
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest discover -s tests -p 'test_quality_validation.py' -v
      - name: Observe Office batch serial versus parallel wall clock
        working-directory: /Users/macbook/ChatGPT
        run: |
          python3 - <<'PY'
          import json
          import statistics
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          sys.path.insert(0, '/Users/macbook/ChatGPT/skills/sol-cabinet/scripts')
          from inspect_office_batch import inspect_many

          W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'
          with tempfile.TemporaryDirectory(dir='/Users/macbook/ChatGPT/.scratch') as temp_dir:
              root = Path(temp_dir)
              body = ''.join(
                  f'<w:p><w:r><w:t>段落{i:05d} 状态进行中 数值 {i}</w:t></w:r></w:p>'
                  for i in range(12000)
              )
              paths = []
              for index in range(8):
                  path = root / f'sample-{index}.docx'
                  with zipfile.ZipFile(path, 'w', compression=zipfile.ZIP_DEFLATED) as package:
                      package.writestr(
                          'word/document.xml',
                          f'<w:document xmlns:w="{W}"><w:body>{body}</w:body></w:document>',
                      )
                  paths.append(path)

              inspect_many(paths, max_workers=1)
              serial = []
              parallel = []
              for round_index in range(4):
                  if round_index % 2 == 0:
                      serial.append(inspect_many(paths, max_workers=1)['wall_clock_seconds'])
                      parallel.append(inspect_many(paths, max_workers=4)['wall_clock_seconds'])
                  else:
                      parallel.append(inspect_many(paths, max_workers=4)['wall_clock_seconds'])
                      serial.append(inspect_many(paths, max_workers=1)['wall_clock_seconds'])
              serial_median = statistics.median(serial)
              parallel_median = statistics.median(parallel)
              ratio = parallel_median / serial_median if serial_median else None
              print(json.dumps({
                  'benchmark': 'hosted-macos-synthetic-office-batch',
                  'serial_seconds': serial,
                  'parallel_seconds': parallel,
                  'serial_median_seconds': serial_median,
                  'parallel_median_seconds': parallel_median,
                  'wall_clock_ratio': ratio,
                  'directional_goal_ratio': 0.7,
                  'hard_gate': False,
                  'interpretation': 'diagnostic only; target-Mac real-work A/B remains required before speed claim',
              }, ensure_ascii=False))
          PY
      - name: Hosted full-suite module diagnostic
        continue-on-error: true
        working-directory: /Users/macbook/ChatGPT
        run: |
          set +e
          failed=0
          for test_file in skills/sol-cabinet/tests/test*.py; do
            echo "=== MODULE ${test_file} ==="
            python3 -m unittest -v "$test_file"
            rc=$?
            echo "=== MODULE_RESULT ${test_file} rc=${rc} ==="
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
