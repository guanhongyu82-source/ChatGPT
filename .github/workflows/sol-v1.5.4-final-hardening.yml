name: Sol v1.5.4 final hardening

# Temporary candidate-only validation; remove before external release validation.
on:
  push:
    branches:
      - cabinet/sol-v1.5.4-quality-parallelism
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-hardening:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      TMPDIR: /Users/macbook/ChatGPT/.scratch
      CODEX_HOME: /Users/macbook/.codex
      PYTHONPATH: /Users/macbook/ChatGPT/skills/sol-cabinet/tests:/Users/macbook/ChatGPT/skills/sol-cabinet/scripts
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Build canonical-path validation environment
        run: |
          sudo mkdir -p /Users/macbook/ChatGPT /Users/macbook/.codex /Users/macbook/.agents
          sudo chown -R "$(id -un)":staff /Users/macbook
          rsync -a --exclude '.git' ./ /Users/macbook/ChatGPT/
          mkdir -p /Users/macbook/ChatGPT/.scratch /Users/macbook/ChatGPT/workspace
          chmod 700 /Users/macbook/.codex
      - name: Keep validation version frozen
        working-directory: /Users/macbook/ChatGPT
        run: test "$(cat skills/sol-cabinet/VERSION)" = "1.5.3"
      - name: Parallel planning regression
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest discover -s tests -p 'test_parallel_planning.py' -v
      - name: Hot-path and evidence contract regression
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest discover -s tests -p 'test_hot_path_policy.py' -v
      - name: Parallel Office batch regression
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest discover -s tests -p 'test_office_batch_inspection.py' -v
      - name: Frozen quality validation regression
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest discover -s tests -p 'test_quality_validation.py' -v
      - name: Fresh-process lifecycle witness
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet/tests
        run: python3 -m unittest -v test_evolution_loop.EvolutionTests.test_lifecycle_transaction_and_rollback
      - name: Hosted full-suite module diagnostic
        continue-on-error: true
        working-directory: /Users/macbook/ChatGPT
        run: |
          set +e
          failed=0
          for test_file in skills/sol-cabinet/tests/test*.py; do
            echo "=== MODULE ${test_file} ==="
            python3 -m unittest -v "$test_file"
            rc=$?
            echo "=== MODULE_RESULT ${test_file} rc=${rc} ==="
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
