# trigger: v1.5.4-t10-lab
name: Sol v1.5.4 T10 laboratory validation

on:
  push:
    branches:
      - cabinet/sol-v1.5.4-quality-parallelism
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t10-laboratory:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      TMPDIR: /Users/macbook/ChatGPT/.scratch
      CODEX_HOME: /Users/macbook/.codex
      PYTHONPATH: /Users/macbook/ChatGPT/skills/sol-cabinet/tests:/Users/macbook/ChatGPT/skills/sol-cabinet/scripts
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Build canonical-path laboratory environment
        run: |
          sudo mkdir -p /Users/macbook/ChatGPT /Users/macbook/.codex /Users/macbook/.agents
          sudo chown -R "$(id -un)":staff /Users/macbook
          rsync -a --exclude '.git' ./ /Users/macbook/ChatGPT/
          mkdir -p /Users/macbook/ChatGPT/.scratch /Users/macbook/ChatGPT/workspace
          chmod 700 /Users/macbook/.codex
      - name: Keep pre-finalization version frozen
        working-directory: /Users/macbook/ChatGPT
        run: test "$(cat skills/sol-cabinet/VERSION)" = "1.5.3"
      - name: T10 end-to-end laboratory chain
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 -m unittest -v tests.test_t10_end_to_end
      - name: Structure validation
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: python3 scripts/validate_structure.py
      - name: Delivery and hot-path regressions
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet
        run: |
          python3 -m unittest discover -s tests -p 'test_delivery_rules.py' -v
          python3 -m unittest discover -s tests -p 'test_hot_path_policy.py' -v
          python3 -m unittest discover -s tests -p 'test_parallel_planning.py' -v
          python3 -m unittest discover -s tests -p 'test_office_batch_inspection.py' -v
          python3 -m unittest discover -s tests -p 'test_quality_validation.py' -v
      - name: Fresh-process evolution lifecycle witness
        working-directory: /Users/macbook/ChatGPT/skills/sol-cabinet/tests
        run: python3 -m unittest -v test_evolution_loop.EvolutionTests.test_lifecycle_transaction_and_rollback
      - name: Full test inventory and module diagnostic
        continue-on-error: true
        working-directory: /Users/macbook/ChatGPT
        run: |
          python3 - <<'PY'
          import ast, pathlib
          count=0
          for path in pathlib.Path('skills/sol-cabinet/tests').glob('test*.py'):
              tree=ast.parse(path.read_text(encoding='utf-8'))
              count += sum(isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name.startswith('test_') for n in ast.walk(tree))
          print('TEST_INVENTORY',count)
          PY
          set +e
          failed=0
          for test_file in skills/sol-cabinet/tests/test*.py; do
            echo "=== MODULE ${test_file} ==="
            python3 -m unittest -v "$test_file"
            rc=$?
            echo "=== MODULE_RESULT ${test_file} rc=${rc} ==="
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
