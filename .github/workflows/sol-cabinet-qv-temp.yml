name: Sol Cabinet v1.5.3 temporary validation

on:
  push:
    branches:
      - cabinet/sol-v1.5.3-quality-validation

jobs:
  quality-validation:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      TMPDIR: /Users/macbook/ChatGPT/.scratch
      CODEX_HOME: /Users/macbook/.codex
      PYTHONPATH: /Users/macbook/ChatGPT/skills/sol-cabinet/tests:/Users/macbook/ChatGPT/skills/sol-cabinet/scripts
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Build canonical-path validation environment
        run: |
          sudo mkdir -p /Users/macbook/ChatGPT /Users/macbook/.codex /Users/macbook/.agents
          sudo chown -R "$(id -un)":staff /Users/macbook
          rsync -a --exclude '.git' ./ /Users/macbook/ChatGPT/
          mkdir -p /Users/macbook/ChatGPT/.scratch /Users/macbook/ChatGPT/workspace
          chmod 700 /Users/macbook/.codex
      - name: Confirm frozen version
        working-directory: /Users/macbook/ChatGPT
        run: test "$(cat skills/sol-cabinet/VERSION)" = "1.5.2"
      - name: Run QV module
        working-directory: /Users/macbook/ChatGPT
        run: python3 -m unittest -v skills/sol-cabinet/tests/test_quality_validation.py
      - name: Run every test module in an isolated Python process
        working-directory: /Users/macbook/ChatGPT
        run: |
          set -euo pipefail
          for test_file in skills/sol-cabinet/tests/test*.py; do
            echo "=== MODULE ${test_file} ==="
            python3 -m unittest -v "$test_file"
          done
